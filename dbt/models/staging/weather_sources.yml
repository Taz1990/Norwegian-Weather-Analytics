version: 2

sources:
  - name: weather
    schema: public
    tables:
      - name: weather_gold
        description: "Gold-level enriched weather data loaded from JSON"
        columns:
          - name: city
            tests:
              - not_null
          - name: date
            tests:
              - not_null
          - name: temperature
            tests:
              - not_null
